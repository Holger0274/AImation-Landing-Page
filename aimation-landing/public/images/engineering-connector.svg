<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
<style>.zg{fill:none;stroke:#8fb6db;stroke-width:1.2}.zg text{fill:#8fb6db;stroke:none;font-family:monospace;font-size:13px}.zg text.zs{font-size:8.5px;letter-spacing:.08em;opacity:.8}.zg text.zl{font-size:12px;letter-spacing:.18em;font-weight:700}.zg text.zb{font-size:17px;font-weight:700}.zg .mitte{stroke-dasharray:22 4 3 4;stroke-width:.8}.zg .mass{stroke-width:.7}.zg .ml{stroke-width:.8}.zg .dick{stroke-width:2}</style>
